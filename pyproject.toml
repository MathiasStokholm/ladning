[project]
name = "ladning"
version = "0.1.0"
description = "Automatic charging of Tesla via Easee"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apscheduler==3.10.4",
    "flask==3.0.3",
    "flask-cors==4.0.1",
    "pyeasee==0.8.14",
    "teslapy==2.9.2",
    "waitress==3.0.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.2",
    "ruff>=0.12.5",
    "ty>=0.0.21",
]

[tool.uv.sources]
teslapy = { git = "https://github.com/Bliph/TeslaPy.git", tag = "http2-transport" }
